[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webhook-delivery-service"
version = "0.1.0"
description = "A reliable asynchronous webhook delivery service with durable persistence, retries, and at-least-once processing."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "psycopg[binary]",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx2"]

[tool.setuptools.packages.find]
where = ["src"]
