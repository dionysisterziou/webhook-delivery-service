name: Pytest

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install project and dev dependencies
        run: python -m pip install ".[dev]"
      - name: Run the default suite
        env:
          POSTGRES_DB: pytest_dummy
          POSTGRES_USER: pytest_dummy
          POSTGRES_PASSWORD: pytest_dummy
          RABBITMQ_DEFAULT_USER: pytest_dummy
          RABBITMQ_DEFAULT_PASS: pytest_dummy
          RABBITMQ_DEFAULT_VHOST: pytest_dummy
        run: python -m pytest -q
